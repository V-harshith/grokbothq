name: Management task (agent queue)
description: File a task for the AI maintainer (Hermes) to execute on this directory
title: "Task: [one line]"
labels: ["agent-task"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Content change (add/edit bot, guide, FAQ)
        - Submission review
        - Featured placement (paid slot)
        - Delist a bot
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Be specific — what should change, to what, and why. The agent follows AGENTS.md.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    options:
      - label: I understand this may trigger a production deploy
        required: true
